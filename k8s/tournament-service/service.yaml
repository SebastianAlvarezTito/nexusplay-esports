apiVersion: v1
kind: Service
metadata:
  name: tournament-service
  namespace: nexusplay
  # Estos labels son los que el ServiceMonitor selecciona (deben coincidir EXACTAMENTE).
  labels:
    app: tournament-service
    app.kubernetes.io/part-of: nexusplay
spec:
  type: NodePort
  selector:
    app: tournament-service
  ports:
    - name: http          # el ServiceMonitor referencia el puerto por este nombre
      port: 8081
      targetPort: http
      nodePort: 30081
      protocol: TCP
