apiVersion: v1
kind: Service
metadata:
  name: matchmaking-service
  namespace: nexusplay
  labels:
    app: matchmaking-service
    app.kubernetes.io/part-of: nexusplay
spec:
  type: NodePort
  selector:
    app: matchmaking-service
  ports:
    - name: http
      port: 8082
      targetPort: http
      nodePort: 30082
      protocol: TCP
