spring.application.name=tournament-service

# Todo configurable por variable de entorno (se fija en el Deployment de k8s)
server.port=${SERVER_PORT:8081}

# Delay artificial (ms) aplicado a /api/** -> Casuística 2 (servicio lento).
# /health y /metrics NUNCA se retrasan, para que los probes sigan sanos.
nexusplay.tournament.artificial-delay-ms=${ARTIFICIAL_DELAY_MS:0}

# --- Actuator: /metrics con formato Prometheus ---------------------------------
# base-path "/" + path-mapping => el endpoint "prometheus" queda en /metrics.
# Solo exponemos "prometheus": /health es nuestro propio controller (rápido y sin dependencias).
management.endpoints.web.base-path=/
management.endpoints.web.exposure.include=prometheus
management.endpoints.web.path-mapping.prometheus=metrics
management.metrics.tags.application=tournament-service
# Histogramas para poder calcular p95 con histogram_quantile() en PromQL
management.metrics.distribution.percentiles-histogram.http.server.requests=true

logging.level.com.nexusplay=INFO
