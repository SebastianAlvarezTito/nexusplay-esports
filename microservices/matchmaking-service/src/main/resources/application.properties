spring.application.name=matchmaking-service
server.port=${SERVER_PORT:8082}

# --- Cliente hacia tournament-service (Servicio A) ------------------------------
# En k8s se resuelve por el nombre del Service dentro del mismo namespace.
nexusplay.tournament-client.base-url=${TOURNAMENT_SERVICE_URL:http://tournament-service:8081}
# Tiempo máximo de espera por llamada. Si A no responde en este tiempo => 503 controlado.
nexusplay.tournament-client.timeout-ms=${TOURNAMENT_CLIENT_TIMEOUT_MS:2000}

# --- Actuator: /metrics con formato Prometheus ---------------------------------
management.endpoints.web.base-path=/
management.endpoints.web.exposure.include=prometheus
management.endpoints.web.path-mapping.prometheus=metrics
management.metrics.tags.application=matchmaking-service
management.metrics.distribution.percentiles-histogram.http.server.requests=true

logging.level.com.nexusplay=INFO
